[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopkeeper"
version = "0.1.0"
description = "Local inventory + cashier system for a family shop"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "ollama>=0.3",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]
claude = ["anthropic>=0.40"]  # only needed if AI_PROVIDER=claude

[project.scripts]
shopkeeper = "shopkeeper.cashier:main"
shopkeeper-web = "shopkeeper.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
