<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shopkeeper</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --ink:#1c2430; --muted:#6b7686;
          --accent:#2563eb; --good:#16a34a; --warn:#c2410c; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0f141a; --card:#171e27; --line:#26303c;
          --ink:#e7ecf2; --muted:#93a0b0; --accent:#5b9bff; --good:#4ade80; --warn:#fb923c; } }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:.6rem .8rem;
           display:flex; align-items:center; gap:.6rem; position:sticky; top:0; z-index:5; }
  header h1 { font-size:1.05rem; margin:0; }
  .tabs { margin-left:auto; display:flex; gap:.3rem; }
  .tabs button { border:1px solid var(--line); background:var(--card); color:var(--ink);
                 padding:.5rem .8rem; border-radius:9px; cursor:pointer; font-size:.9rem; }
  .tabs button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:960px; margin:.8rem auto; padding:0 .8rem; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:.8rem; }
  @media (max-width:720px){ .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:.9rem; margin-bottom:.8rem; }
  .card h2 { font-size:.8rem; margin:0 0 .6rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  input, select, textarea { font:inherit; padding:.6rem; border:1px solid var(--line); border-radius:9px;
                            width:100%; background:var(--bg); color:var(--ink); }
  textarea { resize:vertical; min-height:2.6rem; }
  button.act { background:var(--accent); color:#fff; border:none; padding:.6rem 1rem; border-radius:9px; cursor:pointer; font:inherit; }
  button.act:disabled { opacity:.5; }
  button.mini { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:.45rem .6rem; border-radius:8px; cursor:pointer; }
  .row { display:flex; gap:.5rem; align-items:center; }
  ul { list-style:none; margin:.4rem 0 0; padding:0; }
  li { padding:.55rem .2rem; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
  li:last-child { border-bottom:none; }
  .name { font-weight:600; }
  .muted { color:var(--muted); font-size:.85rem; }
  .price { margin-left:auto; font-variant-numeric:tabular-nums; }
  .pill { font-size:.72rem; padding:.1rem .4rem; border-radius:6px; background:rgba(91,155,255,.15); color:var(--accent); }
  .add { cursor:pointer; }
  .total { font-size:1.5rem; font-weight:700; }
  .warn { color:var(--warn); }
  .good { color:var(--good); }
  .empty { color:var(--muted); padding:.5rem .2rem; }
  #toast { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%); background:var(--ink);
           color:var(--bg); padding:.7rem 1.1rem; border-radius:9px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>🛒 shopkeeper</h1>
  <div class="tabs">
    <button id="tab-sell" class="active" onclick="show('sell')">Sell</button>
    <button id="tab-stock" onclick="show('stock')">Stock</button>
    <button id="tab-dash" onclick="show('dash')">Dash</button>
  </div>
</header>

<main>
  <!-- SELL -->
  <section id="view-sell">
    <div class="card">
      <h2>Quick entry (AI)</h2>
      <div class="row">
        <textarea id="ai-text" placeholder="type a sale: 2 coke, rice 3kg, 6 eggs"></textarea>
      </div>
      <div class="row" style="margin-top:.5rem">
        <button class="act" onclick="aiParse()">Parse into cart</button>
        <span class="muted" id="ai-note"></span>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <h2>Find items</h2>
        <input id="search" placeholder="search (coke, rice…)" oninput="search()" autocomplete="off">
        <ul id="results"><li class="empty">Type to search…</li></ul>
      </div>
      <div class="card">
        <h2>Cart</h2>
        <ul id="cart"><li class="empty">Cart is empty</li></ul>
        <div class="row" style="margin-top:.8rem">
          <span class="muted">Total</span><span class="total price" id="cart-total">0.00</span>
        </div>
        <div class="row" style="margin-top:.8rem">
          <select id="pay" style="max-width:8rem"><option>cash</option><option>card</option></select>
          <button class="act" id="pay-btn" onclick="checkout()" disabled style="margin-left:auto">Complete sale</button>
        </div>
      </div>
    </div>
  </section>

  <!-- STOCK -->
  <section id="view-stock" style="display:none">
    <div class="card">
      <h2>Add item</h2>
      <div class="row">
        <input id="ni-name" placeholder="name">
        <input id="ni-price" placeholder="price" inputmode="decimal" style="max-width:6rem">
        <input id="ni-unit" placeholder="unit" value="each" style="max-width:6rem">
        <button class="act" onclick="addItem()">Add</button>
      </div>
    </div>
    <div class="card">
      <h2>Items — tap price to change, use +qty to restock</h2>
      <ul id="stock-list"><li class="empty">Loading…</li></ul>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="view-dash" style="display:none">
    <div class="card">
      <h2>Today</h2>
      <div class="row"><span class="total good price" id="today-total">0.00</span>
        <span class="muted" id="today-count">0 sales</span>
        <button class="mini" onclick="loadDash()" style="margin-left:auto">Refresh</button></div>
      <ul id="today-list"></ul>
    </div>
    <div class="grid">
      <div class="card"><h2>Low stock</h2><ul id="low"></ul></div>
      <div class="card"><h2>Best sellers (30d)</h2><ul id="best"></ul></div>
    </div>
  </section>
</main>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const money = n => (n==null? '—' : Number(n).toFixed(2));
const esc = s => (s??'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cart = [];
let TOKEN = localStorage.getItem('sk_token') || '';

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

async function api(path, opts={}){
  opts.headers = Object.assign({}, opts.headers||{}, TOKEN?{'X-Token':TOKEN}:{});
  const r = await fetch(path, opts);
  if(r.status===401){ askToken(); throw new Error('password required'); }
  if(!r.ok){ let d; try{ d=(await r.json()).detail; }catch(_){} throw new Error(d || r.statusText); }
  return r.json();
}
function askToken(){ const t = prompt('Shop password:'); if(t){ TOKEN=t; localStorage.setItem('sk_token',t); location.reload(); } }
async function checkAuth(){ try{ const a = await (await fetch('/api/auth')).json(); if(a.required && !TOKEN) askToken(); }catch(_){} }

function show(v){
  for(const k of ['sell','stock','dash']){ $('#view-'+k).style.display = (k===v)?'':'none'; $('#tab-'+k).classList.toggle('active', k===v); }
  if(v==='dash') loadDash();
  if(v==='stock') loadStock();
}

// ---- Sell ----
let searchTimer;
function search(){ clearTimeout(searchTimer); searchTimer=setTimeout(doSearch,150); }
async function doSearch(){
  const q=$('#search').value.trim(), ul=$('#results');
  if(!q){ ul.innerHTML='<li class="empty">Type to search…</li>'; return; }
  const items = await api('/api/search?q='+encodeURIComponent(q));
  ul.innerHTML = items.length ? '' : '<li class="empty">No matches</li>';
  for(const it of items){
    const li=document.createElement('li'); li.className='add';
    li.innerHTML=`<span class="name">${esc(it.name)}</span><span class="muted">${money(it.quantity_on_hand)} ${esc(it.unit)}</span>
      <span class="price">${it.price==null?'<span class=warn>no price</span>':money(it.price)+' '+it.currency}</span>`;
    li.onclick=()=>addToCart(it); ul.appendChild(li);
  }
}
function addToCart(it){
  if(it.price==null){ toast('Set a price first (Stock tab)'); return; }
  const ex=cart.find(l=>l.item_id===it.id);
  if(ex){ ex.quantity+=1; } else { cart.push({item_id:it.id,name:it.name,price:it.price,quantity:1}); }
  renderCart();
}
function renderCart(){
  const ul=$('#cart');
  if(!cart.length){ ul.innerHTML='<li class="empty">Cart is empty</li>'; $('#cart-total').textContent='0.00'; $('#pay-btn').disabled=true; return; }
  ul.innerHTML=''; let total=0;
  cart.forEach((l,i)=>{ total+=l.price*l.quantity;
    const li=document.createElement('li');
    li.innerHTML=`<span class="name">${esc(l.name)}</span>
      <input type="number" min="0" step="1" value="${l.quantity}" style="max-width:4.6rem" onchange="setQty(${i},this.value)">
      <span class="price">${money(l.price*l.quantity)}</span>
      <button class="mini" onclick="delLine(${i})">✕</button>`;
    ul.appendChild(li); });
  $('#cart-total').textContent=money(total); $('#pay-btn').disabled=false;
}
function setQty(i,v){ v=Number(v); if(v>0){ cart[i].quantity=v; } else { cart.splice(i,1); } renderCart(); }
function delLine(i){ cart.splice(i,1); renderCart(); }
async function checkout(){
  try{ const res=await api('/api/sale',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({payment_method:$('#pay').value,lines:cart.map(l=>({item_id:l.item_id,quantity:l.quantity}))})});
    toast(`Sale #${res.id} — ${money(res.total)} ${res.currency}`); cart=[]; renderCart(); doSearch();
  }catch(e){ toast('Error: '+e.message); }
}
async function aiParse(){
  const text=$('#ai-text').value.trim(); if(!text){ return; }
  $('#ai-note').textContent='parsing…';
  try{ const res=await api('/api/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    for(const l of res.lines){ const ex=cart.find(c=>c.item_id===l.item_id);
      if(ex){ ex.quantity+=l.quantity; } else { cart.push({item_id:l.item_id,name:l.name,price:l.unit_price,quantity:l.quantity}); } }
    renderCart();
    $('#ai-note').textContent = res.unresolved.length ? ('not found: '+res.unresolved.join(', ')) : ('added '+res.lines.length+' line(s)');
    $('#ai-text').value='';
  }catch(e){ $('#ai-note').textContent=''; toast('AI: '+e.message); }
}

// ---- Stock ----
async function addItem(){
  const name=$('#ni-name').value.trim(), price=$('#ni-price').value.trim(), unit=$('#ni-unit').value.trim()||'each';
  if(!name||!price){ toast('Name and price required'); return; }
  try{ await api('/api/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,price,unit})});
    $('#ni-name').value=''; $('#ni-price').value=''; toast('Added '+name); loadStock();
  }catch(e){ toast('Error: '+e.message); }
}
async function loadStock(){
  const items = await api('/api/items'); const ul=$('#stock-list');
  ul.innerHTML = items.length ? '' : '<li class="empty">No items yet</li>';
  for(const it of items){
    const li=document.createElement('li');
    li.innerHTML=`<span class="name">${esc(it.name)}</span>
      <span class="muted">${money(it.quantity_on_hand)} ${esc(it.unit)}</span>
      <span class="price add" title="tap to change price" onclick="setPrice(${it.id},'${esc(it.name)}')">${it.price==null?'<span class=warn>set price</span>':money(it.price)}</span>
      <input type="number" placeholder="+qty" inputmode="decimal" style="max-width:5rem" id="rs-${it.id}">
      <button class="mini" onclick="restock(${it.id})">restock</button>`;
    ul.appendChild(li);
  }
}
async function restock(id){
  const el=$('#rs-'+id), q=el.value.trim(); if(!q){ return; }
  try{ const it=await api('/api/items/'+id+'/restock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({quantity:q})});
    toast(`${it.name}: now ${money(it.quantity_on_hand)} ${it.unit}`); loadStock();
  }catch(e){ toast('Error: '+e.message); }
}
async function setPrice(id,name){
  const p=prompt('New price for '+name+':'); if(p==null||p.trim()==='') return;
  try{ await api('/api/items/'+id+'/price',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({price:p.trim()})});
    toast('Price updated'); loadStock();
  }catch(e){ toast('Error: '+e.message); }
}

// ---- Dashboard ----
async function loadDash(){
  const t=await api('/api/today');
  $('#today-total').textContent=money(t.total); $('#today-count').textContent=t.count+' sale'+(t.count===1?'':'s');
  $('#today-list').innerHTML = t.sales.length ? t.sales.map(s=>
    `<li><span class="muted">${s.at}</span><span class="name">#${s.id}</span><span class="pill">${esc(s.payment_method||'')}</span>
     <span class="price">${money(s.total)}</span><button class="mini" onclick="voidSale(${s.id})">void</button></li>`).join('')
    : '<li class="empty">No sales today</li>';
  const low=await api('/api/low?threshold=5');
  $('#low').innerHTML = low.length ? low.map(it=>`<li><span class="name">${esc(it.name)}</span><span class="price warn">${money(it.quantity_on_hand)} ${esc(it.unit)}</span></li>`).join('')
    : '<li class="empty">All well stocked</li>';
  const best=await api('/api/best?days=30');
  $('#best').innerHTML = best.length ? best.map((b,i)=>`<li><span class="muted">${i+1}.</span><span class="name">${esc(b.name)}</span><span class="price">${money(b.qty)} · ${money(b.revenue)}</span></li>`).join('')
    : '<li class="empty">No sales yet</li>';
}
async function voidSale(id){ if(!confirm('Void sale #'+id+'? Stock will be restored.')) return;
  try{ await api('/api/sale/'+id+'/void',{method:'POST'}); toast('Voided #'+id); loadDash(); }catch(e){ toast('Error: '+e.message); } }

checkAuth();
</script>
</body>
</html>
